# TrackOSC – XcodeGen project spec (source of truth for TrackOSC.xcodeproj).
#
# The generated TrackOSC.xcodeproj is committed so end users only need Xcode.
# After adding/removing source files, regenerate with:
#   xcodegen generate

name: TrackOSC
options:
  bundleIdPrefix: com.joelgethinlewis
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  swift-osc:
    url: https://github.com/orchetect/swift-osc
    from: 3.1.0
  PoseioscShared:
    path: PoseioscShared
  SynthCore:
    path: SynthCore
  CostumeCore:
    path: CostumeCore

attributes:
  LastUpgradeCheck: "2630"

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Users select their own team in Xcode → Signing & Capabilities.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    # Xcode's recommended settings (kept here, not applied via Xcode's
    # migration button, because the project file is regenerated by XcodeGen).
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOL_FRAMEWORK_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # Shared by both apps. Bump CURRENT_PROJECT_VERSION for every TestFlight
    # upload; MARKETING_VERSION is the user-facing version and release tag.
    MARKETING_VERSION: "1.8.0"
    CURRENT_PROJECT_VERSION: "13"

targetTemplates:
  # Every receiver-type macOS app (Recorder, Speaker, Router, …) is one of
  # these: its own folder plus ReceiverCore, sandboxed, hardened, listening
  # on the network. Per-app extras (file access, automation) go on the
  # target and merge with these.
  TrackOSCReceiverApp:
    type: application
    platform: macOS
    sources: ["${app_dir}", ReceiverCore]
    dependencies:
      - package: swift-osc
        product: SwiftOSC
      - package: PoseioscShared
        product: PoseioscShared
    info:
      path: "${app_dir}/Info.plist"
      properties:
        CFBundleDisplayName: "${display_name}"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.graphics-design
        NSLocalNetworkUsageDescription: "${display_name} listens for OSC tracking data and advertises itself on your local network via Bonjour."
        NSBonjourServices: ["_osc._udp"]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_NAME: ${target_name}
    entitlements:
      path: "${app_dir}/${target_name}.entitlements"
      properties:
        com.apple.security.network.server: true
        com.apple.security.network.client: true

targets:
  PoseioscSender:
    type: application
    platform: iOS
    # Product renamed to TrackOSC; target name (and therefore the bundle
    # ID, which App Store Connect is keyed on) deliberately unchanged.
    # Both keys are needed: productName names the generated product
    # references (so Xcode doesn't rewrite them), but this XcodeGen doesn't
    # derive the PRODUCT_NAME build setting from it, so set that too.
    productName: TrackOSC
    sources: [Sender, SenderCore]
    dependencies:
      - package: swift-osc
        product: SwiftOSC
      - package: PoseioscShared
        product: PoseioscShared
    info:
      path: Sender/Info.plist
      properties:
        CFBundleDisplayName: TrackOSC
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Standard-encryption-only exemption: skips the export compliance
        # question on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Camera frames are analysed on-device to detect bodies (2D and 3D), hands, faces, text, animals, barcodes, outlines, the horizon and rectangles. No video leaves the phone – only OSC tracking data."
        NSLocalNetworkUsageDescription: "TrackOSC sends OSC tracking data to receivers on your local network and browses for them via Bonjour."
        NSBonjourServices: ["_osc._udp"]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: TrackOSC

  PoseioscSenderMac:
    type: application
    platform: macOS
    # Product renamed; target name (bundle ID, TCC grants) unchanged.
    # Paired with PRODUCT_NAME in settings – see the iOS sender note.
    productName: TrackOSCSender
    sources: [SenderMac, SenderCore]
    dependencies:
      - package: swift-osc
        product: SwiftOSC
      - package: PoseioscShared
        product: PoseioscShared
    info:
      path: SenderMac/Info.plist
      properties:
        CFBundleDisplayName: TrackOSC Sender
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: "Camera frames are analysed on-device to detect bodies (2D and 3D), hands, faces, text, animals, barcodes, outlines, the horizon and rectangles. No video leaves this Mac – only OSC tracking data."
        NSLocalNetworkUsageDescription: "TrackOSC Sender sends OSC tracking data to receivers on your local network and browses for them via Bonjour."
        NSBonjourServices: ["_osc._udp"]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_NAME: TrackOSCSender
    entitlements:
      path: SenderMac/PoseioscSenderMac.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.network.client: true
        # Required to BIND the UDP socket the OSC client sends from –
        # without it the sandbox silently blocks sending entirely.
        com.apple.security.network.server: true

  PoseioscReceiver:
    type: application
    platform: macOS
    # Product renamed; target name (bundle ID, TCC grants) unchanged.
    # Paired with PRODUCT_NAME in settings – see the iOS sender note.
    productName: TrackOSCReceiver
    sources: [Receiver, ReceiverCore]
    dependencies:
      - package: swift-osc
        product: SwiftOSC
      - package: PoseioscShared
        product: PoseioscShared
    info:
      path: Receiver/Info.plist
      properties:
        CFBundleDisplayName: TrackOSC Receiver
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: "TrackOSC Receiver listens for OSC tracking data and advertises itself on your local network via Bonjour."
        NSBonjourServices: ["_osc._udp"]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Sandbox/Hardened Runtime as build settings (Xcode's recommended
        # migration). The network entitlements have no build-setting
        # equivalent, so they stay in the entitlements file.
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_NAME: TrackOSCReceiver
    entitlements:
      path: Receiver/PoseioscReceiver.entitlements
      properties:
        com.apple.security.network.server: true
        com.apple.security.network.client: true

  TrackOSCRecorder:
    templates: [TrackOSCReceiverApp]
    templateAttributes:
      app_dir: Recorder
      display_name: TrackOSC Recorder
    info:
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: TrackOSC Recording
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.joelgethinlewis.trackosc]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.joelgethinlewis.trackosc
            UTTypeDescription: TrackOSC Recording
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [trackosc]
    entitlements:
      properties:
        # Recordings go to a folder the user picks (remembered as a bookmark),
        # or to Downloads by default.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.downloads.read-write: true

  TrackOSCSpeaker:
    templates: [TrackOSCReceiverApp]
    templateAttributes:
      app_dir: Speaker
      display_name: TrackOSC Speaker

  TrackOSCRouter:
    templates: [TrackOSCReceiverApp]
    templateAttributes:
      app_dir: Router
      display_name: TrackOSC Router
    info:
      properties:
        NSAppleEventsUsageDescription: "TrackOSC Router runs Shortcuts you choose when tracking events happen."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    entitlements:
      properties:
        # Running Shortcuts by name goes through Shortcuts Events.
        com.apple.security.automation.apple-events: true
        # Rule files can be imported from and exported to anywhere.
        com.apple.security.files.user-selected.read-write: true

  TrackOSCColours:
    templates: [TrackOSCReceiverApp]
    templateAttributes:
      app_dir: Colours
      display_name: TrackOSC Colours
    sources: [VisualCore]
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: VisualCore/Metal/ShaderTypes.h
        MTL_HEADER_SEARCH_PATHS: $(SRCROOT)/VisualCore/Metal
    entitlements:
      properties:
        # Screenshots go to Downloads.
        com.apple.security.files.downloads.read-write: true

  TrackOSCParticles:
    templates: [TrackOSCReceiverApp]
    templateAttributes:
      app_dir: Particles
      display_name: TrackOSC Particles
    sources: [VisualCore]
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: VisualCore/Metal/ShaderTypes.h
        MTL_HEADER_SEARCH_PATHS: $(SRCROOT)/VisualCore/Metal
    entitlements:
      properties:
        com.apple.security.files.downloads.read-write: true

  TrackOSCText:
    templates: [TrackOSCReceiverApp]
    templateAttributes:
      app_dir: Text
      display_name: TrackOSC Text
    sources: [VisualCore]
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: VisualCore/Metal/ShaderTypes.h
        MTL_HEADER_SEARCH_PATHS: $(SRCROOT)/VisualCore/Metal
    entitlements:
      properties:
        com.apple.security.files.downloads.read-write: true

  TrackOSCSynth:
    templates: [TrackOSCReceiverApp]
    templateAttributes:
      app_dir: Synth
      display_name: TrackOSC Synth
    dependencies:
      - package: SynthCore
        product: SynthCore
    info:
      properties:
        LSApplicationCategoryType: public.app-category.music
    entitlements:
      properties:
        # Presets can be imported from and exported to anywhere.
        com.apple.security.files.user-selected.read-write: true

  TrackOSCCostumes:
    templates: [TrackOSCReceiverApp]
    templateAttributes:
      app_dir: Costumes
      display_name: TrackOSC Costumes
    dependencies:
      - package: CostumeCore
        product: CostumeCore
    entitlements:
      properties:
        # A folder of the user's own costumes, remembered as a bookmark; recordings to Downloads.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.downloads.read-write: true

  TrackOSCColoursTests:
    type: bundle.unit-test
    platform: macOS
    sources: [VisualCoreTests]
    dependencies:
      - target: TrackOSCColours
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: VisualCore/Metal/ShaderTypes.h
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TrackOSCSender:
    build:
      targets:
        PoseioscSender: all
    run:
      config: Debug
  TrackOSCSenderMac:
    build:
      targets:
        PoseioscSenderMac: all
    run:
      config: Debug
  TrackOSCReceiver:
    build:
      targets:
        PoseioscReceiver: all
    run:
      config: Debug
  TrackOSCRecorder:
    build:
      targets:
        TrackOSCRecorder: all
    run:
      config: Debug
  TrackOSCSpeaker:
    build:
      targets:
        TrackOSCSpeaker: all
    run:
      config: Debug
  TrackOSCRouter:
    build:
      targets:
        TrackOSCRouter: all
    run:
      config: Debug
  TrackOSCColours:
    build:
      targets:
        TrackOSCColours: all
        TrackOSCColoursTests: [test]
    run:
      config: Debug
    test:
      targets: [TrackOSCColoursTests]
  TrackOSCParticles:
    build:
      targets:
        TrackOSCParticles: all
    run:
      config: Debug
  TrackOSCText:
    build:
      targets:
        TrackOSCText: all
    run:
      config: Debug
  TrackOSCSynth:
    build:
      targets:
        TrackOSCSynth: all
    run:
      config: Debug
  TrackOSCCostumes:
    build:
      targets:
        TrackOSCCostumes: all
    run:
      config: Debug
